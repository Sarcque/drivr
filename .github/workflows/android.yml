name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew assembleDebug --console=plain
      - name: Unit and screenshot tests
        run: ./gradlew verifyPaparazziDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: drivr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Every build of main replaces the APK on the "latest" release, so there is one stable link:
      # https://github.com/Sarcque/drivr/releases/download/latest/drivr.apk
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk drivr.apk
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          notes="Debug build of main at ${GITHUB_SHA::7}. Install drivr.apk on Android 8 or newer."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes"
          else
            gh release create latest --prerelease --title "Latest build" --notes "$notes"
          fi
          gh release upload latest drivr.apk --clobber
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: paparazzi-diffs
          path: android/app/build/paparazzi/failures
